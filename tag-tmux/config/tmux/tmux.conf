set-option -g pane-active-border-style "fg=#505050"
set-option -g pane-border-style "fg=#303030"
set-option -g status-right "#{host_short}  %R"
set-option -g status-style "fg=#b0b0b0,bg=#202020"

bind-key -N "Reload config file" r source-file ~/.config/tmux/tmux.conf \; \
  display-message "Reloaded config file"

bind-key -N "Select pane left" h select-pane -L
bind-key -N "Select pane below" j select-pane -D
bind-key -N "Select pane above" k select-pane -U
bind-key -N "Select pane right" l select-pane -R
