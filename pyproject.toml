[tool.ruff]
target-version = "py39"
extend-include = ["tag-bin/local/bin/dotfiles", "tag-git/local/bin/git-get"]

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # Trailing comma missing
  "CPY",    # flake8-copyright
  "D100",   # Module docstring
  "EM102",  # f-string in exception
  "T201",   # print found
  "TRY003", # Message outside exception class
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.9"

[tool.ty.rules]
all = "error"

[tool.ty.src]
include = ["tag-bin/local/bin/dotfiles", "tag-git/local/bin/git-get"]
