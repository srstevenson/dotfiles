[language-server.rumdl]
command = "rumdl"
args = ["server"]

[language-server.rledger-lsp]
command = "rledger-lsp"

[[language]]
name = "beancount"
language-servers = ["rledger-lsp"]

[[language]]
name = "json"
formatter = { command = "jq", args = ["."] }

[[language]]
name = "markdown"
auto-format = true
language-servers = ["rumdl"]

[[language]]
name = "python"
auto-format = true

[[language]]
name = "toml"
auto-format = true
