# Install with:
#   hx --grammar fetch
#   hx --grammar build
use-grammars = { only = ["xit"] }

[language-server.rumdl]
command = "rumdl"
args = ["server"]

[language-server.rledger-lsp]
command = "rledger-lsp"

[[language]]
name = "beancount"
language-servers = ["rledger-lsp"]

[[language]]
name = "json"
formatter = { command = "jq", args = ["."] }

[[language]]
name = "markdown"
auto-format = true
language-servers = ["rumdl"]

[[language]]
name = "python"
auto-format = true

[[language]]
name = "toml"
auto-format = true

[[grammar]]
name = "xit"
source = { git = "https://github.com/srstevenson/tree-sitter-xit", rev = "srs/tags-and-due-dates" }
